<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f5">
  <meta name="description" content="Kies de framekleur, het dak en de afwerking van je veranda in de interactieve demo van SENS.">
  <title>Verandaconfigurator · SENS</title>
  <link rel="icon" href="sens-logo.png" type="image/png">
  <link rel="preload" href="tuin.webp" as="image">
  <link rel="stylesheet" href="studio.css?v=stapbeelden">
  <script defer src="veranda-renderer.js?v=stapbeelden"></script>
  <script defer src="studio.js?v=stapbeelden"></script>
</head>
<body>
  <a class="skip" href="#configurator">Naar het keuzemenu</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./" aria-label="SENS, startpagina"><img src="sens-logo.png" alt="SENS"></a>
    </div>
  </header>
  <main class="wrap">
    <div class="page-intro">
      <h1>Stel je veranda samen<span>.</span></h1>
      <p class="lead">Kies de kleur, het dak en de afwerking van je veranda.</p>
    </div>
    <div id="configurator">
      <nav class="step-nav" aria-label="Stappen">
        <button type="button" class="is-active" data-step="1" aria-current="step"><span>1</span>Framekleur</button><i aria-hidden="true"></i>
        <button type="button" data-step="2"><span>2</span>Dak</button><i aria-hidden="true"></i>
        <button type="button" data-step="3"><span>3</span>Wanden</button><i aria-hidden="true"></i>
        <button type="button" data-step="4"><span>4</span>Extra’s</button><i aria-hidden="true"></i>
        <button type="button" data-step="5"><span>5</span>Maten</button>
      </nav>
      <div class="workspace">
        <figure class="gallery" id="gallery" aria-label="Je samengestelde veranda">
          <canvas id="preview-canvas" width="1200" height="800" aria-label="Visueel voorbeeld van je gekozen veranda" aria-describedby="preview-description">Het overzicht aan het einde toont alle onderdelen van je veranda.</canvas>
          <button type="button" class="circle photo-expand" id="expand-picture" aria-label="Voorbeeld vergroten" title="Voorbeeld vergroten"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.8 4.5H4.5v4.3m10.7-4.3h4.3v4.3M4.5 15.2v4.3h4.3m10.7-4.3v4.3h-4.3"/></svg></button>
          <figcaption class="size-caption"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m3 15 12-12 6 6L9 21zM7 11l2 2m1-5 2 2m1-5 2 2"/></svg><span id="current-size">500 × 300 cm</span></figcaption>
          <span class="sr-only" id="preview-description"></span>
        </figure>
        <section class="choice-panel" aria-label="Keuzemenu">
          <div id="step-content"></div>
          <noscript><p>Schakel JavaScript in om de kleuren en materialen te bekijken.</p></noscript>
          <div id="actions" class="panel-actions">
            <span id="step-counter">Keuze 1 van 10</span>
            <button type="button" class="back-button" id="back" hidden>Vorige</button>
            <button type="button" class="primary-button" id="next">Volgende</button>
          </div>
        </section>
      </div>
    </div>
    <footer><span>SENS Consult</span><span>Verandaconfigurator · Demo</span></footer>
  </main>
  <dialog id="photo-dialog" class="photo-dialog" aria-label="Vergroot voorbeeld van jouw veranda">
    <button class="dialog-close" type="button" aria-label="Sluiten">×</button>
  </dialog>
  <script>
    const preview = document.getElementById('preview-canvas');
    const enlarged = document.getElementById('photo-dialog');
    document.getElementById('expand-picture').addEventListener('click', () => {
      enlarged.append(preview);
      enlarged.showModal();
    });
    enlarged.addEventListener('close', () => document.getElementById('gallery').prepend(preview));
    enlarged.querySelector('button').addEventListener('click', () => enlarged.close());
    enlarged.addEventListener('click', event => { if (event.target === enlarged) enlarged.close(); });
  </script>
</body>
</html>
